version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pokehunter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    # command: sh -c "npx prisma migrate deploy && npm run start:dev"
    volumes:
      - .:/app
    working_dir: /app/backend
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/pokehunter"
    depends_on:
      - db
    ports:
      - "3001:3001"
    command: npm run start:dev
    # network_mode: host

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend


volumes:
  postgres_data:
